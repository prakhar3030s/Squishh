// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    subproject.plugins.withType(org.gradle.api.plugins.JavaBasePlugin).configureEach {
        def javaToolchains = subproject.extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
        subproject.tasks.withType(JavaCompile).configureEach {
            javaCompiler.set(javaToolchains.compilerFor {
                languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
            })
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
