apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'jacoco'

android {
    namespace = "com.prakhar.squishh"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.prakhar.squishh"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    splits {
        abi {
            enable true
            reset()
            // Cover 64-bit ARM, 32-bit ARM devices, and x86_64 emulators/Chromebooks plus universal fallback APK
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    def keystoreFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }
    def hasReleaseSigning = keystoreFile.exists() &&
        !keystoreProps.getProperty('storeFile', '').trim().isEmpty() &&
        !keystoreProps.getProperty('storePassword', '').trim().isEmpty() &&
        !keystoreProps.getProperty('keyAlias', '').trim().isEmpty() &&
        !keystoreProps.getProperty('keyPassword', '').trim().isEmpty()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile').trim())
                storePassword keystoreProps.getProperty('storePassword').trim()
                keyAlias keystoreProps.getProperty('keyAlias').trim()
                keyPassword keystoreProps.getProperty('keyPassword').trim()
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled true
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "io.mockk:mockk:1.13.13"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "io.insert-koin:koin-test:4.0.2"
    testImplementation "io.insert-koin:koin-test-junit4:4.0.2"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Kotlin Coroutines for async native background processing
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // Lightweight DI container (Koin)
    implementation "io.insert-koin:koin-android:4.0.2"

    // Jetpack Media3 for hardware-accelerated video transcoding
    def media3Version = "1.5.1"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
    ]

    def kotlinDebugTree = fileTree(dir: "${project.layout.buildDirectory.asFile.get()}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def javaDebugTree = fileTree(dir: "${project.layout.buildDirectory.asFile.get()}/intermediates/javac/debug/classes", excludes: fileFilter)

    sourceDirectories.setFrom(files(["${project.projectDir}/src/main/java"]))
    classDirectories.setFrom(files([kotlinDebugTree, javaDebugTree]))
    executionData.setFrom(fileTree(dir: project.layout.buildDirectory.asFile.get(), includes: [
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'jacoco/testDebugUnitTest.exec'
    ]))
}

apply from: 'capacitor.build.gradle'
